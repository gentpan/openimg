    <meta name="theme-color" content="#0a0a0a" />
    <script>
      // Runs before the stylesheet paints, so a light-theme user never sees a
      // dark flash. Mirrors the logic in src/ThemeContext.tsx; kept inline
      // because any external file would already be too late.
      (function () {
        try {
          var p = localStorage.getItem("openimg.theme");
          var t = p === "dark" || p === "light" ? p
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.style.colorScheme = t;
          if (t === "light") {
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#ffffff");
          }
        } catch (e) {}
      })();
    </script>
