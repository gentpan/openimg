    <script>
      // Brand hue, applied before first paint so the page never renders green
      // and then flips to violet after React mounts. Mirrors src/BrandContext.tsx;
      // inline because any external file would already be too late.
      (function () {
        try {
          // Language, before first paint. Not for styling — for the lang
          // attribute, which decides how the browser breaks CJK lines and
          // whether it offers to translate the page. Getting it after mount
          // means the first screen is laid out under the wrong rules.
          var l = localStorage.getItem("openimg-lang");
          if (l !== "zh" && l !== "en") {
            l = /^zh\b/i.test(navigator.language || "") ? "zh" : "en";
          }
          document.documentElement.lang = l === "zh" ? "zh-CN" : "en";

          if (localStorage.getItem("openimg-brand") === "violet") {
            document.documentElement.setAttribute("data-brand", "violet");
            // The icon links too. They are files, not variables, so the only
            // lever is the href — and it has to move before the browser has
            // fetched one, or the tab flashes the other brand.
            document
              .querySelectorAll('link[rel~="icon"], link[rel="apple-touch-icon"]')
              .forEach(function (l) {
                l.href = l.getAttribute("href").replace(/(favicon|apple-touch-icon)/, "$1-violet");
              });
          }
        } catch (e) {}
      })();
    </script>
