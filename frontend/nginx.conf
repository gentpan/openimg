server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses; assets under /assets/ are already minified
    # binaries-in-name-only (JS/CSS) and benefit the most.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames, so the content behind one can never
    # change — a year of immutable caching is safe and keeps repeat visits
    # from re-downloading the whole app.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 50m;
        proxy_read_timeout 300s;
    }

    location /storage/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /healthz {
        proxy_pass http://backend:8080;
    }
}
